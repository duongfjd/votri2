<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐM</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        #floatingText {
            position: absolute;
            font-size: 100px;
            font-weight: bold;
            animation: rainbow 7s steps(7, end) infinite; /* Discrete 7-color steps */
        }
        @keyframes rainbow {
            0% { color: #ff0000; } /* Red */
            14.29% { color: #ff7f00; } /* Orange */
            28.57% { color: #ffff00; } /* Yellow */
            42.86% { color: #00ff00; } /* Green */
            57.14% { color: #0000ff; } /* Blue */
            71.43% { color: #4b0082; } /* Indigo */
            85.71% { color: #8b00ff; } /* Violet */
            100% { color: #ff0000; } /* Back to Red */
        }
    </style>
</head>
<body>
    <div id="floatingText">ĐM TRẦN ANH ĐẠT</div>

    <script>
        const floatingText = document.getElementById("floatingText");
        let posX = Math.random() * window.innerWidth;
        let posY = Math.random() * window.innerHeight;
        let speedX = 3;
        let speedY = 3;

        function moveText() {
            posX += speedX;
            posY += speedY;

            if (posX + floatingText.offsetWidth > window.innerWidth || posX < 0) {
                speedX = -speedX;
            }
            if (posY + floatingText.offsetHeight > window.innerHeight || posY < 0) {
                speedY = -speedY;
            }

            floatingText.style.left = posX + "px";
            floatingText.style.top = posY + "px";

            requestAnimationFrame(moveText);
        }

        floatingText.style.left = posX + "px";
        floatingText.style.top = posY + "px";
        moveText();
    </script>
</body>
</html>
